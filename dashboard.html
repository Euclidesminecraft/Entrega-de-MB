<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MegaFlow</title><style>
:root{--bg:#06121d;--c:#0e2234;--l:#1c3a55;--t:#e9f2f9;--m:#86a1b8;--az:#2f8bff;--vd:#18c98b}
*{box-sizing:border-box}body{margin:0 auto;max-width:720px;padding:16px;background:var(--bg);color:var(--t);font:15px/1.4 system-ui,sans-serif}
h1{font-size:22px;margin:0;display:flex;gap:12px;align-items:center}h1 small{display:block;font:12px system-ui;color:var(--m)}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--az),var(--vd));display:grid;place-items:center}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.k{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:10px}.k b{display:block;font-size:22px}.k span{font-size:11px;color:var(--m);text-transform:uppercase}
nav{display:flex;gap:6px;margin-bottom:12px}button{background:var(--c);color:var(--t);border:1px solid var(--l);border-radius:10px;padding:9px 14px;font:inherit}
.on,.p{background:linear-gradient(135deg,var(--az),var(--vd));border:0;font-weight:600}
.card{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:12px;margin-bottom:8px}
.r{display:flex;justify-content:space-between;gap:8px;align-items:center}.m{color:var(--m);font-size:13px}
.s{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}
input,textarea{width:100%;background:#0a1a29;color:var(--t);border:1px solid var(--l);border-radius:10px;padding:10px;font:inherit;margin:6px 0}
pre{white-space:pre-wrap;word-break:break-all;color:var(--vd);font-size:12px}.h{display:none}
</style></head><body>
<h1><span class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg></span><span>MegaFlow<small>pagamento M-Pesa → megas entregues</small></span></h1>
<div class="g" id="k"></div>
<nav><button id="b-p" class="on" onclick="tab('p')">Pedidos</button><button id="b-c" onclick="tab('c')">Preços</button><button id="b-s" onclick="tab('s')">Definições</button></nav>
<section id="p"><div class="card"><b>Testar um SMS</b><textarea id="t" rows="3">Confirmado TESTE001. Recebeste 80.00MT de 258840000000 - TESTE aos 17/10/2026 as 10:00.</textarea><button class="p" onclick="testar()">Enviar para /sms</button><pre id="o"></pre></div><div id="pl"></div></section>
<section id="c" class="h"><div class="card"><b>Tabela de preços</b><div class="m">Os MB só valem 24h. Entre 100 e 10240 MB.</div><div id="cl"></div><div class="r"><input id="mt" type="number" placeholder="MT"><input id="mb" type="number" placeholder="MB"><button class="p" onclick="addp()">+</button></div></div></section>
<section id="s" class="h"><div class="card"><b>Token (para o MacroDroid)</b><pre id="tk"></pre><b>Remetentes aceites</b><div class="m">Separados por vírgula. Vazio desliga a verificação.</div><input id="rm"><b>Limite diário</b><input id="li" type="number" min="1" max="10"><button class="p" onclick="saves()">Guardar</button></div></section>
<script>
const T="__TOKEN__",$=id=>document.getElementById(id);let S={pedidos:[],precos:{},remetentes:[]},first=1;
const cor={A_ENTREGAR:"#2f8bff",EM_EXECUCAO:"#f4b740",REVISAO:"#9a7bff",FALHA:"#ff6b6b",ENTREGUE:"#18c98b"};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api=async(p,o={})=>(await fetch(p,{...o,headers:{"x-token":T,...(o.headers||{})}})).json();
function tab(x){for(const i of["p","c","s"]){$(i).classList.toggle("h",i!=x);$("b-"+i).classList.toggle("on",i==x)}}
async function load(){S=await api("/api/estado");const c=e=>S.pedidos.filter(p=>p.estado==e).length;
$("k").innerHTML=[["Fila","A_ENTREGAR"],["A executar","EM_EXECUCAO"],["Revisão","REVISAO"],["Falhas","FALHA"],["Entregues","ENTREGUE"]].map(([n,e])=>`<div class=k><b style="color:${cor[e]}">${c(e)}</b><span>${n}</span></div>`).join("")+`<div class=k><b>${S.feitos_hoje}/${S.limite}</b><span>Hoje</span></div>`;
$("pl").innerHTML=S.pedidos.map(p=>`<div class=card><div class=r><b>${p.valor_mt} MT → ${p.mb??"?"} MB</b><span class=s style="background:${cor[p.estado]}22;color:${cor[p.estado]}">${p.estado}</span></div><div class=m>${esc(p.numero)} · ${esc(p.id_mpesa)} · ${esc(p.criado.slice(5,16).replace("T"," "))}</div>${p.nota!="ok"?`<div class=m>${esc(p.nota)}</div>`:""}</div>`).join("")||'<div class="card m">Sem pedidos ainda.</div>';
$("cl").innerHTML=Object.entries(S.precos).map(([a,b])=>`<div class=r style="padding:6px 0"><span>${a} MT → ${b} MB</span><button onclick="delp(${a})">Apagar</button></div>`).join("")||'<div class=m>Ainda sem preços.</div>';
if(first){first=0;$("tk").textContent=T;$("rm").value=S.remetentes.join(",");$("li").value=S.limite}}
const cfg=async o=>{await api("/api/config",{method:"POST",body:JSON.stringify(o)});load()};
async function testar(){$("o").textContent=JSON.stringify(await api("/sms",{method:"POST",headers:{"x-remetente":S.remetentes[0]||""},body:$("t").value}));load()}
function addp(){const a=+$("mt").value,b=+$("mb").value;if(a>0&&b>=100&&b<=10240){S.precos[a]=b;cfg({precos:S.precos});$("mt").value=$("mb").value=""}else alert("MB entre 100 e 10240")}
function delp(a){delete S.precos[a];cfg({precos:S.precos})}
function saves(){cfg({remetentes:$("rm").value.split(","),limite:+$("li").value})}
load();setInterval(load,5000);
</script></body></html>
